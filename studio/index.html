<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Studio Sample</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:transparent; }
  body {
    background:transparent;
    color:#fff;
    font-family:'Carter One', cursive, sans-serif;
    padding:0;
    overflow:hidden;
  }
  .player {
    width:100%; max-width:640px; margin:0 auto;
    background:#1C1C21;
    border:1px solid #FFFFFF;
    border-radius:0.125rem;
    box-shadow:0 0 0.25rem 0 #FF00F5;
    padding:14px 16px 12px;
    position:relative;
    user-select:none;
  }
  .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .brand { font-size:13px; letter-spacing:0.22em; text-transform:uppercase; color:#fff; text-shadow:0.108rem 0.062rem 0.875rem #FF008A; white-space:nowrap; }
  .brand .tag { color:#FF8CA8; margin-right:6px; }
  .brand .dur { font-family:'Lucida Console','Courier New',monospace; font-size:9px; color:rgba(255,255,255,.55); letter-spacing:0.1em; margin-left:8px; }
  /* ---- waveform ---- */
  .wave-wrap { position:relative; height:64px; margin-bottom:8px; cursor:pointer; touch-action:none; }
  .wave-wrap canvas { display:block; width:100%; height:64px; }
  .wave-wrap.loading canvas { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
  .loadtxt {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:10px; letter-spacing:0.3em; color:rgba(255,255,255,.85); text-shadow:0.108rem 0.062rem 0.875rem #FF008A; pointer-events:none;
  }
  .wave-wrap.loading .loadtxt { display:flex; }
  /* ---- bottom row ---- */
  .bottom { display:flex; align-items:center; gap:8px; }
  .ctl {
    background:transparent; border:1px solid #FFFFFF; color:#fff; cursor:pointer;
    border-radius:0.375rem;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .25s ease, color .25s ease, background-color .25s ease;
  }
  .ctl:hover { border-color:#FF8CA8; color:#FF8CA8; }
  .ctl svg { display:block; fill:currentColor; }
  .ctl.play { width:42px; height:42px; flex:0 0 auto; }
  .ctl.play svg { width:15px; height:15px; }
  .ctl.play .icoPlay { display:block; } .ctl.play .icoPause { display:none; }
  body.playing .ctl.play .icoPlay { display:none; } body.playing .ctl.play .icoPause { display:block; }
  .ctl.mute { width:30px; height:30px; }
  .mute svg { width:15px; height:15px; display:block; }
  .mute .on { display:block; } .mute .off { display:none; }
  body.muted .mute .on { display:none; } body.muted .mute .off { display:block; }
  /* ---- volume control ---- */
  .vol { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .vol-slider {
    -webkit-appearance:none; appearance:none;
    width:64px; height:3px; background:rgba(255,255,255,.3);
    outline:none; cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:11px; height:11px; border-radius:50%;
    background:#FF8CA8; border:1px solid #fff;
    box-shadow:0 0 0.35rem 0 rgba(255,0,138,.7);
    cursor:pointer;
  }
  .vol-slider::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%;
    background:#FF8CA8; border:1px solid #fff;
    box-shadow:0 0 0.35rem 0 rgba(255,0,138,.7);
    cursor:pointer;
  }
  .vol-slider::-moz-range-track { height:3px; background:rgba(255,255,255,.3); }
  .vol-slider::-moz-range-progress { height:3px; background:#FF008A; }
  .time {
    margin-left:auto; font-family:'Lucida Console','Courier New',monospace;
    font-size:11px; letter-spacing:0.08em; color:rgba(255,255,255,.85); white-space:nowrap;
  }
  .time b { color:#FF8CA8; font-weight:400; }
  /* ---- entrance fade (carrd onvisible fade-up: speed 1875, intensity 5) ---- */
  .enter-init { opacity:0; transform:translateY(7.5rem); }
  .enter-play {
    opacity:1; transform:none;
    transition:opacity 1.875s ease, transform 1.875s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .enter-init { opacity:1; transform:none; }
    .enter-play { transition:none; }
  }
  /* ---- fallback ---- */
  .fallback { display:none; text-align:center; padding:6px 0 2px; }
  body.failed .fallback { display:block; }
  body.failed .wave-wrap, body.failed .bottom { display:none; }
  .fallback p { font-size:9px; letter-spacing:0.2em; color:rgba(255,255,255,.6); margin-bottom:10px; text-transform:uppercase; }
  .fallback a {
    display:inline-block; margin:3px 4px; padding:6px 10px;
    border:1px solid #FFFFFF; color:#fff; text-decoration:none;
    background:transparent; border-radius:0.375rem;
    font-size:9px; letter-spacing:0.12em; text-transform:uppercase;
    transition:background-color .25s ease, color .25s ease;
  }
  .fallback a:hover { border-color:#FF8CA8; color:#FF8CA8; }
  /* ---- compact: constant total height at any width ---- */
  @media (max-width: 560px) {
    .brand { font-size:11.5px; }
    .brand .dur { display:none; }
    .vol-slider { width:44px; }
    .time { font-size:10px; }
    .wave-wrap { height:60px; }
    .wave-wrap canvas { height:60px; }
    .player { padding:11px 12px 9px; }
  }
</style>
</head>

      <svg class="off" viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5 15 9.5M15 5.5 11 9.5" stroke="currentColor" stroke-width="1.3"/></svg>

    renderTime(); scheduleDraw();
  });
  audio.addEventListener('error', fail);
  setTimeout(function () { if (!ready && !failed) fail(); }, 20000);

  function fail() {
    if (failed) return;
    failed = true;
    rootEl.classList.add('failed');
  }

  /* ---------- waveform seeking ---------- */
  function waveTime(evt) {
    var r = canvas.getBoundingClientRect();
    var x = (evt.touches ? evt.touches[0].clientX : evt.clientX) - r.left;
    return Math.max(0, Math.min(1, x / r.width)) * duration();
  }
  waveWrap.addEventListener('pointerdown', function (e) {
    if (failed || !ready) return;
    dragging = true;
    previewT = waveTime(e); renderTime(); scheduleDraw();
    if (waveWrap.setPointerCapture) { try { waveWrap.setPointerCapture(e.pointerId); } catch (er) {} }
  });
  waveWrap.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    previewT = waveTime(e); renderTime(); scheduleDraw();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    var t = previewT;
    previewT = null;
    if (t !== null) seekTo(t);
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* ---------- controls ---------- */
  playBtn.addEventListener('click', togglePlay);
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    rootEl.classList.toggle('muted', muted);
    applyVolume();
  });
  volSlider.addEventListener('input', function () {
    volume = parseInt(volSlider.value, 10);
    if (muted && volume > 0) {
      muted = false;
      rootEl.classList.remove('muted');
    }
    applyVolume();
  });

  window.addEventListener('resize', scheduleDraw);

  /* ---------- entrance fade: handshake with parent page ----------
     parent embed script posts 'nvo-visible' every 400ms until acked.
     embedded: fade requires ready AND (signal queued OR 45s failsafe).
     standalone: fade as soon as ready. ack ('nvo-ack') stops the parent loop. */
  var pc = document.getElementById('playerCard');
  var enterDone = false, pendingVisible = false;
  function tryEnter() {
    if (enterDone || !ready) return;
    if (window.self !== window.top && !pendingVisible) return;
    enterDone = true;
    pc.classList.add('enter-play');
    try { window.parent.postMessage('nvo-ack', '*'); } catch (e) {}
  }
  function failsafeEnter() {
    if (enterDone) return;
    enterDone = true;
    pc.classList.add('enter-play');
  }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return; /* only our direct parent may trigger */
    if (e.data === 'nvo-visible') { pendingVisible = true; tryEnter(); }
  });
  var bootPoll = setInterval(function () {
    if (enterDone) { clearInterval(bootPoll); return; }
    tryEnter();
  }, 300);
  if (window.self !== window.top) {
    setTimeout(failsafeEnter, 45000);
  }

  /* ---------- boot ---------- */
  renderTime(); draw();
  window.__ns = {
    get state() { return { ready: ready, playing: playing, pos: pos, failed: failed, dur: DUR }; }
  };
})();
</script>
</body>
</html>
