<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Player</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { background:transparent; }
  body {
    background:transparent;
    color:#fff;
    font-family:'Carter One', cursive, sans-serif;
    padding:0;
    overflow:hidden;
  }
  .player {
    width:100%; max-width:640px; margin:0 auto; margin:0 auto;
    background:#1C1C21;
    border:1px solid #FFFFFF;
    border-radius:0.125rem;
    box-shadow:0 0 0.25rem 0 #FF00F5;
    padding:14px 16px 12px;
    position:relative;
    user-select:none;
  }
  /* ---- header ---- */
  .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
  .brand { font-size:13px; letter-spacing:0.22em; text-transform:uppercase; color:#fff; text-shadow:0.108rem 0.062rem 0.875rem #FF008A; white-space:nowrap; }
  .brand .tag { color:#FF8CA8; margin-right:6px; }
  .ctl.mute { width:30px; height:30px; }
  .mute svg { width:15px; height:15px; display:block; }
  .mute .on { display:block; } .mute .off { display:none; }
  body.muted .mute .on { display:none; } body.muted .mute .off { display:block; }
  /* ---- tabs ---- */
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab {
    flex:1 1 0; min-width:0; background:rgba(255,255,255,0.169);
    border:1px solid #FFFFFF; color:#fff; border-radius:0.375rem;
    box-shadow:0 0 0.5rem 0 #FF008A;
    font-family:inherit; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase;
    height:28px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
    transition:background-color .25s ease, color .25s ease, border-color .25s ease, box-shadow .25s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;
  }
  .tab:hover { background:#FF8CA8; border-color:#FF8CA8; color:#FFFFFF; }
  .tab.active { background:#FF008A; border-color:#FF008A; color:#fff; }
  .tab .dur { font-family:'Lucida Console', monospace; font-size:8px; opacity:.75; letter-spacing:0; }
  /* equalizer icon on the active tab */
  .eq { display:none; align-items:flex-end; gap:1.5px; height:10px; width:12px; flex:0 0 auto; }
  .eq i { display:block; width:2.5px; background:currentColor; animation:eqb 0.9s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.15s } .eq i:nth-child(3){ animation-delay:.3s }
  @keyframes eqb { 0%,100%{height:3px} 50%{height:10px} }
  body.playing .tab.active .eq { display:flex; }
  /* ---- waveform ---- */
  .wave-wrap { position:relative; height:64px; margin-bottom:6px; cursor:pointer; touch-action:none; }
  .wave-wrap canvas { display:block; width:100%; height:64px; }
  .wave-wrap.loading canvas { animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
  .loadtxt {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:10px; letter-spacing:0.3em; color:rgba(255,255,255,.85); text-shadow:0.108rem 0.062rem 0.875rem #FF008A; pointer-events:none;
  }
  .wave-wrap.loading .loadtxt { display:flex; }
  /* ---- bottom row ---- */
  .bottom { display:flex; align-items:center; gap:8px; }
  .ctl {
    background:transparent; border:1px solid #FFFFFF; color:#fff; cursor:pointer;
    border-radius:0.375rem;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .25s ease, color .25s ease, background-color .25s ease;
  }
  .ctl:hover { border-color:#FF8CA8; color:#FF8CA8; }
  .ctl svg { display:block; fill:currentColor; }
  .ctl.prev, .ctl.next { width:30px; height:30px; flex:0 0 auto; }
  .ctl.prev svg, .ctl.next svg { width:11px; height:11px; }
  .ctl.play { width:42px; height:42px; flex:0 0 auto; }
  .ctl.play svg { width:15px; height:15px; }
  .ctl.play .icoPlay { display:block; } .ctl.play .icoPause { display:none; }
  body.playing .ctl.play .icoPlay { display:none; } body.playing .ctl.play .icoPause { display:block; }
  .time {
    margin-left:auto; font-family:'Lucida Console','Courier New',monospace;
    font-size:11px; letter-spacing:0.08em; color:rgba(255,255,255,.85); white-space:nowrap;
  }
  .time b { color:#FF8CA8; font-weight:400; }
  .sc-link { color:rgba(255,255,255,.45); font-size:8.5px; letter-spacing:0.18em; text-decoration:none; transition:color .25s ease; }
  .sc-link:hover { color:#FF8CA8; }
  /* ---- volume control ---- */
  .vol { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .vol-slider {
    -webkit-appearance:none; appearance:none;
    width:64px; height:3px; background:rgba(255,255,255,.3);
    outline:none; cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:11px; height:11px; border-radius:50%;
    background:#FF8CA8; border:1px solid #fff;
    box-shadow:0 0 0.35rem 0 rgba(255,0,138,.7);
    cursor:pointer;
  }
  .vol-slider::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%;
    background:#FF8CA8; border:1px solid #fff;
    box-shadow:0 0 0.35rem 0 rgba(255,0,138,.7);
    cursor:pointer;
  }
  .vol-slider::-moz-range-track { height:3px; background:rgba(255,255,255,.3); }
  .vol-slider::-moz-range-progress { height:3px; background:#FF008A; }
  /* ---- fallback ---- */
  .fallback { display:none; text-align:center; padding:6px 0 2px; }
  body.failed .fallback { display:block; }
  body.failed .tabs, body.failed .wave-wrap, body.failed .bottom { display:none; }
  .fallback p { font-size:9px; letter-spacing:0.2em; color:rgba(255,255,255,.6); margin-bottom:10px; text-transform:uppercase; }
  .fallback a {
    display:inline-block; margin:3px 4px; padding:6px 10px;
    border:1px solid #FFFFFF; color:#fff; text-decoration:none;
    background:transparent; border-radius:0.375rem;
    font-size:9px; letter-spacing:0.12em; text-transform:uppercase;
    transition:background-color .25s ease, color .25s ease;
  }
  .fallback a:hover { border-color:#FF8CA8; color:#FF8CA8; }
  /* ---- entrance fade (mirrors carrd onvisible 'fade-up', speed 1875, intensity 5) ---- */
  .enter-init { opacity:0; transform:translateY(7.5rem); }
  .enter-play {
    opacity:1; transform:none;
    transition:opacity 1.875s ease, transform 1.875s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .enter-init { opacity:1; transform:none; }
    .enter-play { transition:none; }
  }
  /* ---- compact: keep total height constant at any width (fixed-height iframe embed) ---- */
  @media (max-width: 560px) {
    .tab { font-size:8.5px; letter-spacing:0.05em; gap:3px; height:26px; padding:0 2px; }
    .tab .dur, .tab .eq { display:none !important; }
    .brand { font-size:11.5px; }
    .vol-slider { width:44px; }
    .time { font-size:10px; }
    .sc-link { display:none; }
    .wave-wrap { height:60px; }
    .wave-wrap canvas { height:60px; }
    .player { padding:11px 12px 9px; }
  }
</style>
</head>
